    <text x="100" y="245" font-family="monospace" font-size="16" fill="#C4B5FD">&gt; Exploring AI, engineering &amp; open source</text>

    <text x="78" y="305" font-size="17" font-style="italic" fill="#E9D5FF">Build. Break. Learn. Improve.</text>
